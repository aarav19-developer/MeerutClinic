<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Primary meta ───────────────────────────────────────────────── -->
    <title>Dr. Pradeep Adhana — General Physician | [CITY]</title>
    <meta
      name="description"
      content="Dr. Pradeep Adhana — experienced General Physician and Child Specialist (Pediatrician). Book an appointment Mon–Sat. Call [PHONE NUMBER] or WhatsApp."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://[YOUR-DOMAIN]/" />

    <!-- ── Open Graph ──────────────────────────────────────────────────── -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://[YOUR-DOMAIN]/" />
    <meta property="og:title"       content="Dr. Pradeep Adhana — General Physician & Child Specialist" />
    <meta property="og:description" content="Book an appointment with Dr. Pradeep Adhana. Open Mon–Sat. Located at [ADDRESS, CITY]." />
    <meta property="og:image"       content="https://[YOUR-DOMAIN]/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale"      content="en_IN" />
    <meta property="og:site_name"   content="Dr. Pradeep Adhana Clinic" />

    <!-- ── Twitter Card ────────────────────────────────────────────────── -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Dr. Pradeep Adhana — General Physician & Child Specialist" />
    <meta name="twitter:description" content="Book an appointment with Dr. Pradeep Adhana. Open Mon–Sat." />
    <meta name="twitter:image"       content="https://[YOUR-DOMAIN]/og-image.png" />

    <!-- ── Favicon ─────────────────────────────────────────────────────── -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- ── Google Fonts: Nunito (headings) + DM Sans (body) ──────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600&family=DM+Serif+Display&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600&family=DM+Serif+Display&display=swap" />

    <!-- ── Theme colour ────────────────────────────────────────────────── -->
    <meta name="theme-color" content="#2d8c8c" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
